# ==============================================================================
# Global Configuration
# ==============================================================================
global:
  scrape_interval: 5s  # How often to collect metrics (other options: 1s, 2s, 5s)

# ==============================================================================
# Scrape Configurations
# ==============================================================================
scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Prometheus self-monitoring
  # ----------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------------------------------------------------------
  # 2. Container telemetry from Telegraf Docker Engine API collector
  # ----------------------------------------------------------------------------
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['docker-metrics:9273']

  # ----------------------------------------------------------------------------
  # 3. Host system metrics from node-exporter
  # ----------------------------------------------------------------------------
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # ----------------------------------------------------------------------------
  # 4. FastAPI Model Serving Telemetry
  # ----------------------------------------------------------------------------
  - job_name: 'iaq-model-api'
    static_configs:
      - targets: ['api:8000']