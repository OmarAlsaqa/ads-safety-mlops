# ==============================================================================
# Grafana Dashboards Provisioning
# ==============================================================================
apiVersion: 1

providers:
  - name: 'Docker & Container Telemetry'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json