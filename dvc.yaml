stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - src/schema.py
      - data/raw/train.csv
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/ad_click_graph.pt:
          cache: false
      - data/simulated_production/production_drift_stream.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/models/graph_nc.py
      - src/models/layers.py
      - src/models/losses.py
      - data/processed/ad_click_graph.pt
    outs:
      - models/graph_nc.pt
      - models/training_metrics.json
  materialize_features:
    cmd: python src/materialize_feast.py
    deps:
      - src/materialize_feast.py
      - feature_store/features.py
      - feature_store/feature_store.yaml
      - data/processed/train.parquet
    outs:
      - data/registry.db

  evaluate_drift:
    cmd: python src/evaluate_drift.py
    deps:
      - src/evaluate_drift.py
      - data/processed/train.parquet
      - data/simulated_production/production_drift_stream.csv
      - models/graph_nc.pt
    outs:
      - docs/reports/data_drift_report.html
      - docs/reports/data_drift_summary.json

